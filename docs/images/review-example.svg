<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc">
<title id="title">Ask another assistant for a review without leaving your conversation</title>
<desc id="desc">Illustrative conversation. A user in Claude sends a remote_prompt to codex-review. Codex reviews the supplied diff and returns two findings to the original conversation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#8ea7c9" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="540" rx="20" fill="#101823"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="32" y="43" fill="#edf3fc" font-size="23" font-weight="700">A second opinion, in your existing conversation</text>
<text x="32" y="70" fill="#a8bad0" font-size="14">ILLUSTRATIVE MOCKUP · NOT AN ACTUAL APP SCREENSHOT</text>
<rect x="28" y="94" width="470" height="408" rx="14" fill="#1b2839" stroke="#31445e"/>
<rect x="582" y="94" width="470" height="408" rx="14" fill="#1b2839" stroke="#31445e"/>
<circle cx="53" cy="123" r="6" fill="#efb89c"/><text x="69" y="129" fill="#f0f4fa" font-size="18" font-weight="600">Your Claude session</text>
<circle cx="607" cy="123" r="6" fill="#88d9c4"/><text x="623" y="129" fill="#f0f4fa" font-size="18" font-weight="600">Connected Codex session</text>
<text x="50" y="165" fill="#b7c7dc" font-size="13">YOU</text>
<rect x="46" y="180" width="434" height="94" rx="10" fill="#2b4060"/>
<text x="62" y="207" fill="#ffffff" font-size="16"><tspan x="62">Use harness-interop:</tspan><tspan x="62" dy="24">/remote_prompt codex-review</tspan><tspan x="62" dy="24">Review this diff. Don't change files.</tspan></text>
<text x="604" y="165" fill="#b7c7dc" font-size="13">REQUEST RECEIVED</text>
<rect x="600" y="180" width="434" height="94" rx="10" fill="#253b40"/>
<text x="616" y="207" fill="#eef8f4" font-size="16"><tspan x="616">Review the supplied diff.</tspan><tspan x="616" dy="24">Return findings to the Claude session.</tspan><tspan x="616" dy="24">Scope: review only.</tspan></text>
<path d="M506 221 H571" stroke="#8ea7c9" stroke-width="2" marker-end="url(#arrow)"/>
<text x="540" y="205" fill="#b7c7dc" font-size="11" text-anchor="middle">REQUEST</text>
<text x="604" y="310" fill="#88d9c4" font-size="13">CODEX REVIEW</text>
<text x="616" y="343" fill="#edf3fc" font-size="16"><tspan x="616">Two issues found:</tspan><tspan x="616" dy="28">1. The timeout path doesn't release its lock.</tspan><tspan x="616" dy="28">2. Retries can create duplicate records.</tspan></text>
<path d="M574 416 H509" stroke="#8ea7c9" stroke-width="2" marker-end="url(#arrow)"/>
<text x="540" y="443" fill="#b7c7dc" font-size="11" text-anchor="middle">REPLY</text>
<text x="50" y="310" fill="#88d9c4" font-size="13">BACK IN YOUR CONVERSATION</text>
<rect x="46" y="326" width="434" height="148" rx="10" fill="#213a38"/>
<text x="62" y="355" fill="#eef8f4" font-size="16"><tspan x="62">Codex returned two findings about</tspan><tspan x="62" dy="26">lock cleanup and duplicate records.</tspan><tspan x="62" dy="35">No files changed.</tspan><tspan x="62" dy="26">You decide what happens next.</tspan></text>
</g></svg>
